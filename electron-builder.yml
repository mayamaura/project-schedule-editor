# electron-builder の設定（Phase 0: 署名なしの Windows ビルド。署名・自動更新は Phase 5）
appId: local.project-schedule-editor
productName: ProjectScheduleEditor
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
# Copilot の実行本体（CLI）は、asar の外に展開して起動する（asar の中のバイナリは実行できない）。決定 I2。
asarUnpack:
  - node_modules/@github/copilot-sdk-*/**
# GitHub Copilot CLI License の条件: ライセンスのコピーを同梱し、表示を残す（変更せずに配布する）。
extraResources:
  - from: third-party/copilot-cli-LICENSE.md
    to: licenses/copilot-cli-LICENSE.md
win:
  target:
    - target: nsis
      arch: [x64]
  # Phase 0 は署名・実行ファイルの書き換え（rcedit）を行わない。署名は Phase 5（K7: 可能なら実施）。
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: プロジェクトスケジュールエディタ
# Electron Fuses（セキュリティ強化。NF-007）
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
